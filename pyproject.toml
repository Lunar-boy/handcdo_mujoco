[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handcdo_mujoco"
version = "0.1.0"
description = "CPU-only MuJoCo reproduction of dexterous hand co-design optimization infrastructure."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "optuna>=3.5",
  "scikit-learn>=1.3",
  "shap>=0.44",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "trimesh>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
warp = ["mujoco-warp"]

[tool.setuptools.packages.find]
include = ["handcdo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires CUDA-capable GPU and optional MuJoCo Warp dependencies",
  "slow: long-running benchmark or sweep",
  "slurm: intended to run inside a Slurm allocation",
  "capella: intended for Capella GPU validation",
  "alpha: intended for Alpha GPU validation",
]
