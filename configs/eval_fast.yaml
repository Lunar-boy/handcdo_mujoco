simulation:
  timestep: 0.002
  settle_steps: 120
  close_steps: 180
  wrench_steps: 120
  control_stiffness: 6.0

wrench:
  translation_threshold: 0.045
  rotation_threshold_rad: 0.55

grasp:
  n_trials: 2
  sampler: random

output:
  save_mjcf: true

geometry:
  finger:
    mode: capsule
    fingertip_pad_enabled: false

  palm:
    mode: box_pads

  tool:
    mode: primitive
