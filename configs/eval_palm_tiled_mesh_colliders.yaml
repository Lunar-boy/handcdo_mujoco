simulation:
  timestep: 0.002
  settle_steps: 350
  close_steps: 450
  wrench_steps: 400
  control_stiffness: 6.0

wrench:
  translation_threshold: 0.045
  rotation_threshold_rad: 0.55

grasp:
  n_trials: 8
  sampler: tpe

output:
  save_mjcf: true

geometry:
  finger:
    mode: capsule_tip_pad
    fingertip_pad_enabled: true
    fingertip_pad_shape: box
    fingertip_pad_thickness: 0.004
    fingertip_pad_friction: [1.4, 0.03, 0.003]

  palm:
    mode: tiled_mesh_colliders
    pad_friction: [1.4, 0.02, 0.002]
    mesh_collider_resolution: 6
    mesh_collider_type: quad_frustum
    mesh_collider_domain: outline
    mesh_collider_thickness: 0.003
    mesh_collider_margin_ratio: 0.0
    max_num_mesh_colliders: 36

  tool:
    mode: hybrid
    collision_margin: 0.001
