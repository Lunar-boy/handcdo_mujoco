simulation:
  timestep: 0.002
  settle_steps: 350
  close_steps: 450
  wrench_steps: 400
  control_stiffness: 6.0

wrench:
  translation_threshold: 0.045
  rotation_threshold_rad: 0.55

grasp:
  n_trials: 8
  sampler: tpe

output:
  save_mjcf: true

geometry:
  finger:
    mode: local_convex_patches
    fingertip_body_shape: ellipsoid
    local_patch_resolution: 4
    local_patch_collider_type: quad_frustum
    local_patch_thickness: 0.003
    local_patch_margin_ratio: 0.0
    max_num_local_patch_colliders: 128
    fingertip_pad_enabled: true

  palm:
    mode: tiled_mesh_colliders
    mesh_collider_domain: outline
    mesh_collider_resolution: 6
    mesh_collider_type: quad_frustum
    mesh_collider_thickness: 0.003
    mesh_collider_margin_ratio: 0.0
    max_num_mesh_colliders: 64

  tool:
    mode: hybrid
    collision_margin: 0.001
